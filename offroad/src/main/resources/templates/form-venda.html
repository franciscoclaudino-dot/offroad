<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        OffRoad - Cadastro de Venda
    </title>

</head>

<body>

<h1>🏍️ Loja OffRoad</h1>

<h2>Cadastro de Venda</h2>


<!-- ========================================= -->
<!-- MENSAGEM DE ERRO -->
<!-- ========================================= -->

<div th:if="${erro}"
     style="
        color: red;
        font-weight: bold;
        margin-bottom: 15px;
     ">

    <span th:text="${erro}"></span>

</div>


<form th:action="@{/vendas/salvar}"
      th:object="${venda}"
      method="post">


    <!-- ========================================= -->
    <!-- ID -->
    <!-- ========================================= -->

    <input type="hidden"
           th:field="*{id}">


    <!-- ========================================= -->
    <!-- DATA -->
    <!-- ========================================= -->

    <label>
        Data da venda:
    </label>

    <input type="date"
           th:field="*{data}"
           required>

    <br><br>


    <!-- ========================================= -->
    <!-- CLIENTE -->
    <!-- ========================================= -->

    <label>
        Cliente:
    </label>

    <select th:field="*{cliente}"
            required>

        <option value="">
            Selecione um cliente
        </option>

        <option th:each="cliente : ${clientes}"
                th:value="${cliente.id}"
                th:text="${cliente.nome}">
        </option>

    </select>

    <br><br>


    <!-- ========================================= -->
    <!-- MOTO -->
    <!-- ========================================= -->

    <label>
        Moto:
    </label>

    <select th:field="*{moto}"
            required>

        <option value="">
            Selecione uma moto
        </option>

        <option th:each="moto : ${motos}"
                th:value="${moto.id}"
                th:text="${moto.marca + ' ' +
                          moto.modelo + ' - ' +
                          moto.cilindrada + 'cc - Estoque: ' +
                          moto.estoque}"
                th:disabled="${moto.estoque == null or
                              moto.estoque <= 0}">
        </option>

    </select>

    <br>

    <small>
        Motos com estoque 0 não estão disponíveis para venda.
    </small>

    <br><br>


    <!-- ========================================= -->
    <!-- VALOR -->
    <!-- ========================================= -->

    <label>
        Valor da venda:
    </label>

    <input type="number"
           step="0.01"
           min="0.01"
           th:field="*{valorTotal}"
           placeholder="25000.00"
           required>

    <br>

    <small>
        O valor deve ser maior que zero.
    </small>

    <br><br>


    <!-- ========================================= -->
    <!-- BOTÃO -->
    <!-- ========================================= -->

    <button type="submit">
        Salvar Venda
    </button>

</form>


<br>


<!-- ========================================= -->
<!-- VOLTAR -->
<!-- ========================================= -->

<a href="/vendas">
    Voltar para vendas
</a>

</body>

</html>
