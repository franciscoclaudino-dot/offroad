<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>OffRoad - Vendas</title>
</head>

<body>

<h1>🏍️ Loja OffRoad</h1>

<h2>Registro de Vendas</h2>

<a href="/vendas/novo">Registrar nova venda</a>

<br><br>

<table border="1" cellpadding="8">

    <thead>
    <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Cliente</th>
        <th>Moto</th>
        <th>Valor Total</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="venda : ${vendas}">

        <td th:text="${venda.id}"></td>

        <td th:text="${venda.data}"></td>

        <td th:text="${venda.cliente.nome}"></td>

        <td th:text="${venda.moto.marca + ' ' + venda.moto.modelo}"></td>

        <td th:text="${venda.valorTotal}"></td>

        <td>

            <a th:href="@{/vendas/editar/{id}(id=${venda.id})}">
                Editar
            </a>

            |

            <a th:href="@{/vendas/excluir/{id}(id=${venda.id})}"
               onclick="return confirm('Deseja realmente excluir esta venda?')">
                Excluir
            </a>

        </td>

    </tr>

    </tbody>

</table>

<br>

<a href="/motos">Motos</a>

<a href="/clientes">Clientes</a>

</body>

</html>
